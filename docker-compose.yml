version: "3.9"

services:
  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "8000:8000"
    env_file:
      - ./auth_service/.env
    volumes:
      - ./auth_service/auth.db:/app/auth.db
    restart: unless-stopped
  
  bot_api:
    build: ./bot_service
    container_name: bot_api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001
    env_file:
      - ./bot_service/.env
    depends_on:
      - redis
      - rabbitmq
      - auth_service
    ports:
      - "8001:8001"
    restart: unless-stopped
  
  bot:
    build: ./bot_service
    container_name: bot
    command: uv run python app/run_bot.py
    env_file:
      - ./bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped
  
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
  
  celery_worker:
    build: ./bot_service
    container_name: celery_worker
    command: uv run celery -A app.infra.celery_app:celery_app worker --loglevel=info
    env_file:
      - ./bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped
  
  celery_beat:
    build: ./bot_service
    container_name: celery_beat
    command: uv run celery -A app.infra.celery_app:celery_app beat --loglevel=info
    env_file:
      - ./bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data: